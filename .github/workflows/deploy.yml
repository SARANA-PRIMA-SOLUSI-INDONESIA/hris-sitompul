name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e

            echo "==> [1/6] Pull kode terbaru"
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin main

            echo "==> [2/6] Install dependensi PHP (tanpa dev)"
            composer install --no-dev --no-interaction --prefer-dist --no-progress

            echo "==> [3/6] Build aset frontend"
            npm install --no-audit --no-fund
            npm run build

            echo "==> [4/6] Migrasi database"
            php artisan migrate --force

            echo "==> [5/6] Optimasi cache produksi"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> [5b/6] Storage symlink"
            php artisan storage:link

            echo "==> [6/6] Restart queue worker & PHP-FPM"
            sudo systemctl restart hris-queue || true
            sudo systemctl reload php8.3-fpm || true

            echo "==> Deploy selesai"
