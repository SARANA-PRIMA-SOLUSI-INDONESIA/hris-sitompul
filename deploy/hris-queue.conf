; Supervisor config untuk Laravel queue worker
; Salin ke /etc/supervisor/conf.d/hris-queue.conf lalu:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start hris-queue:*

[program:hris-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hris-sitombung/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/hris-sitombung/storage/logs/queue.log
stderr_logfile=/var/www/hris-sitombung/storage/logs/queue-error.log
stopwaitsecs=3600
