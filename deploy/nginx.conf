server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.com www.domain-anda.com;

    root /var/www/hris-sitombung/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset statis - cache lama & aman
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Blokir akses file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Blokir akses langsung ke file sensitif Laravel
    location ~ ^/(\.env|composer\.(json|lock)|artisan|storage/logs|bootstrap/cache) {
        deny all;
    }

    # Health check sederhana
    location /health {
        access_log off;
        return 200 "ok";
    }
}
